<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ~/ - the site's terminal home-path motif (matches the hero status line).
       Rendered as text in a monospace stack so the tilde sits low on the
       baseline and aligns with the slash, exactly like the ~/skills text.
       Transparent background; the ~ adapts to light/dark browser tabs. -->
  <style>
    .t { fill: #14161a; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ffffff; }
    }
  </style>
  <text x="32" y="43" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace"
        font-size="46" font-weight="500"><tspan class="t" font-size="58">~</tspan><tspan fill="#2947f0">/</tspan></text>
</svg>
